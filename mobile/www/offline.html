<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Rapid Math</title>
<style>
  html, body { margin: 0; height: 100%; background: #fafbfc; color: #0f172a; font-family: -apple-system, system-ui, sans-serif; }
  body { display: grid; place-items: center; padding: 24px; box-sizing: border-box; text-align: center; }
  .logo { width: 56px; height: 56px; border-radius: 14px; background: #3b82f6; color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 28px; margin: 0 auto 20px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: #64748b; font-size: 15px; margin: 0 0 24px; line-height: 1.5; }
  button { background: #3b82f6; color: #fff; border: 0; border-radius: 10px; padding: 12px 24px; font-size: 16px; font-weight: 600; }
</style>
</head>
<body>
  <div>
    <div class="logo">R</div>
    <h1>You're offline</h1>
    <p>Rapid Math needs an internet connection to sync your streak and progress.</p>
    <button onclick="location.href='https://rapidmath.lovable.app/dashboard'">Try again</button>
  </div>
<script>try{var p=window.Capacitor&&window.Capacitor.Plugins.SplashScreen&&window.Capacitor.Plugins.SplashScreen.hide();p&&p.catch&&p.catch(function(){})}catch(e){}</script>
</body>
</html>
